server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Security headers (mirror the API's Helmet defaults). Note: add_header
    # at the server level is NOT inherited by a location that defines its own
    # add_header, so /assets/ and the asset-ext regex re-declare them below.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Block dotfile probes (/.env, /.git/config, ...) that would otherwise
    # soft-pass through the SPA fallback as 200 index.html.
    location ~ /\. {
        deny all;
    }

    # SPA fallback: any path that isn't a real file goes to index.html so
    # React Router handles it (/c/:slug, /:user/r/:token, /reset-password...).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived immutable asset caching. Vite outputs hashed filenames in
    # /assets/, so these can be cached aggressively and never go stale.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}