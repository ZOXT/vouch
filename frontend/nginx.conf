server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any path that isn't a real file goes to index.html so
    # React Router handles it (/c/:slug, /:user/r/:token, /reset-password...).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived immutable asset caching. Vite outputs hashed filenames in
    # /assets/, so these can be cached aggressively and never go stale.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}