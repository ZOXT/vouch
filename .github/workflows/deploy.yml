name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # GHCR requires lowercase repository names; github.repository_owner preserves
  # the original casing ("ZOXT"), so pin the registry owner explicitly.
  REGISTRY_OWNER: zoxt

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ env.REGISTRY_OWNER }}/vouch-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ env.REGISTRY_OWNER }}/vouch-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_ORIGIN=${{ secrets.VITE_API_ORIGIN }}
            VITE_API_BASE=${{ secrets.VITE_API_BASE }}
            VITE_PADDLE_ENV=${{ secrets.VITE_PADDLE_ENV }}
            VITE_PADDLE_CLIENT_TOKEN=${{ secrets.VITE_PADDLE_CLIENT_TOKEN }}

      - name: Build and push embedding image
        uses: docker/build-push-action@v6
        with:
          context: ./embedding-service
          file: ./embedding-service/Dockerfile
          push: true
          tags: ghcr.io/${{ env.REGISTRY_OWNER }}/vouch-embedding:latest
          cache-from: type=gha

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to EC2 over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /srv/vouch
            git pull --ff-only origin main
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f